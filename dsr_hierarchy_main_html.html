    <!-- Dataverse Live Data Fetcher -->
    <script>
    window.DataverseFetcher = {
      async fetchHierarchyData(entityName, lookupField, recordId = null) {
        try {
          // Get current context - try multiple ways
          let webApi = null;
          
          if (window.parent && window.parent.Xrm && window.parent.Xrm.WebApi) {
            webApi = window.parent.Xrm.WebApi;
          } else if (window.Xrm && window.Xrm.WebApi) {
            webApi = window.Xrm.WebApi;
          } else if (window.parent && window.parent.parent && window.parent.parent.Xrm) {
            webApi = window.parent.parent.Xrm.WebApi;
          }
          
          if (!webApi) {
            console.warn('Xrm.WebApi not available, using sample data');
            return null;
          }

          // Build query for the entity
          const entitySetName = this.getEntitySetName(entityName);
          const fields = this.getFieldsForEntity(entityName, lookupField);
          
          let query = `?$select=${fields.join(',')}`;
          
          // Add filter for active records if applicable
          if (entityName === 'contact' || entityName === 'systemuser') {
            query += `&$filter=statecode eq 0`; // Active records only
          }
          
          // Limit to reasonable number for performance
          query += `&$top=500`;
          
          console.log(`Fetching data from: ${entitySetName}${query}`);
          
          const result = await webApi.retrieveMultipleRecords(entityName, query);
          
          console.log(`Fetched ${result.entities.length} records from ${entityName}`);
          return result.entities;
          
        } catch (error) {
          console.error('Error fetching Dataverse data:', error);
          console.warn('Falling back to sample data');
          return null;
        }
      },
      
      getEntitySetName(entityName) {
        const entitySetNames = {
          'contact': 'contacts',
          'account': 'accounts',
          'systemuser': 'systemusers',
          'team': 'teams'
        };
        
        return entitySetNames[entityName] || `${entityName}s`;
      },
      
      getFieldsForEntity(entityName, lookupField) {
        const fieldMappings = {
          'contact': [
            'contactid', 'fullname', 'jobtitle', 'emailaddress1', 
            'telephone1', 'department', '_parentcustomerid_value',
            'entityimage', 'address1_city', '_managerid_value'
          ],
          'account': [
            'accountid', 'name', 'accountnumber', 'telephone1', 
            'websiteurl', 'address1_city', '_parentaccountid_value',
            'entityimage', 'numberofemployees'
          ],
          'systemuser': [
            'systemuserid', 'fullname', 'title', 'internalemailaddress',
            'domainname', '_businessunitid_value', '_parentsystemuserid_value',
            'entityimage'
          ],
          'new_department': [
            'new_departmentid', 'new_name', 'new_description', 'new_manager',
            'new_location', 'new_budget', '_new_parentdepartment_value',
            'new_logo', 'createdon', 'modifiedon'
          ]
        };
        
        let fields = fieldMappings[entityName] || [
          `${entityName}id`, 'new_name', 'new_description', `_${lookupField}_value`
        ];
        
        // Ensure lookup field is included with proper naming
        const lookupFieldOData = `_${lookupField}_value`;
        if (!fields.includes(lookupFieldOData) && !fields.includes(lookupField)) {
          fields.push(lookupFieldOData);
        }
        
        return fields;
      }
    };
    </script>
    
    <!-- Configuration Application Script -->
    <script>
    function applyDataverseConfiguration() {
        // Get entity and record information from URL parameters or form context
        let entityFromUrl, lookupFromUrl, entityFromContext, recordIdFromContext;
        
        // Try to get from URL parameters first
        const urlParams = new URLSearchParams(window.location.search);
        entityFromUrl = urlParams.get('entity') || urlParams.get('entityName');
        lookupFromUrl = urlParams.get('lookup') || urlParams.get('lookupField');
        const useLiveData = urlParams.get('useLiveData') === 'true';
        const forceEntity = urlParams.get('forceEntity'); // Force specific entity detection
        
        // Try to get from Dataverse form context
        if (window.parent && window.parent.Xrm && window.parent.Xrm.Page) {
            try {
                const formContext = window.parent.Xrm.Page;
                entityFromContext = formContext.data.entity.getEntityName();
                recordIdFromContext = formContext.data.entity.getId();
                console.log('Detected entity from form context:', entityFromContext);
            } catch (e) {
                console.log('Could not get form context:', e);
            }
        }
        
        // Determine which entity configuration to use
        const targetEntity = forceEntity || entityFromUrl || entityFromContext || "new_department"; // Default to your entity
        const targetLookupField = lookupFromUrl || getLookupFieldForEntity(targetEntity);
        
        console.log('Target entity:', targetEntity);
        console.log('Target lookup field:', targetLookupField);
        console.log('Use live data:', useLiveData);
        
        // Create configuration
        const config = {
            entityName: targetEntity,
            selfReferencingField: targetLookupField,
            currentRecordId: recordIdFromContext,
            useLiveData: useLiveData,
            
            // Card fields based on entity
            cardFields: getCardFieldsForEntity(targetEntity),
            
            displayOptions: {
                direction: "vertical",
                autoExpand: 2,
                showActions: true,
                showConnectors: true
            },
            
            cardStyle: {
                width: 200,
                height: 120,
                backgroundColor: "#ffffff",
                borderColor: "#e1e1e1",
                textColor: "#323130"
            }
        };
        
        // Apply configuration globally
        window.DataverseHierarchyConfig = config;
        
        console.log('Applied Dataverse Hierarchy Configuration:', window.DataverseHierarchyConfig);
        
        // Fetch live data if requested
        if (useLiveData || entityFromContext) {
            fetchAndApplyLiveData(targetEntity, targetLookupField);
        }
        
        return config;
    }
    
    function getLookupFieldForEntity(entityName) {
        const entityLookupMap = {
            "contact": "parentcustomerid",
            "account": "parentaccountid", 
            "systemuser": "parentsystemuserid",
            "team": "administratorid",
            "new_department": "new_parentdepartment" // Add your custom entity
        };
        
        return entityLookupMap[entityName] || "new_parentdepartment"; // Default to your lookup field
    }
    
    function getCardFieldsForEntity(entityName) {
        const entityCardFields = {
            "contact": {
                title: "fullname",
                subtitle: "jobtitle", 
                info1: "department",
                info2: "emailaddress1",
                info3: "telephone1",
                avatar: "entityimage"
            },
            "account": {
                title: "name",
                subtitle: "accountnumber",
                info1: "telephone1",
                info2: "websiteurl", 
                info3: "address1_city",
                avatar: "entityimage"
            },
            "systemuser": {
                title: "fullname",
                subtitle: "title",
                info1: "domainname",
                info2: "internalemailaddress",
                info3: "businessunitid",
                avatar: "entityimage"
            },
            "new_department": {
                title: "new_name",
                subtitle: "new_description",
                info1: "new_manager", 
                info2: "new_location",
                info3: "new_budget",
                avatar: "new_logo"
            }
        };
        
        return entityCardFields[entityName] || entityCardFields["new_department"]; // Default to your entity
    }
    
    function transformDataverseRecords(records, entityName, lookupField) {
        console.log('Transforming records for React app:', records.length);
        
        // Get the ID field name for this entity
        const idField = `${entityName}id`;
        const lookupFieldOData = `_${lookupField}_value`;
        
        // Transform records to match React app expectations
        const transformedRecords = records.map(record => {
            // Get the primary name field based on entity type
            let nameField, titleField;
            
            if (entityName === 'contact') {
                nameField = 'fullname';
                titleField = 'jobtitle';
            } else if (entityName === 'account') {
                nameField = 'name';
                titleField = 'accountnumber';
            } else if (entityName === 'systemuser') {
                nameField = 'fullname';
                titleField = 'title';
            } else {
                // For custom entities, try common patterns
                nameField = record['new_name'] ? 'new_name' : 
                           record['name'] ? 'name' : 
                           Object.keys(record).find(key => key.includes('name'));
                           
                titleField = record['new_title'] ? 'new_title' :
                            record['new_description'] ? 'new_description' :
                            Object.keys(record).find(key => key.includes('title') || key.includes('description'));
            }
            
            const transformed = {
                id: record[idField],
                [idField]: record[idField], // Keep original ID field
                name: record[nameField] || record.name || 'Unnamed',
                title: record[titleField] || '',
                parentId: record[lookupFieldOData] || null,
                [lookupField]: record[lookupFieldOData], // Keep original lookup field
                // Copy all original fields
                ...record
            };
            
            // For contact entities, add the expected managerid field
            if (entityName === 'contact' && lookupField === 'parentcustomerid') {
                transformed.managerid = record[lookupFieldOData];
                transformed.contactid = record.contactid;
            }
            
            console.log('Transformed record:', transformed);
            return transformed;
        });
        
        console.log('Final transformed records:', transformedRecords);
        return transformedRecords;
    }
    
    // Global function to override React app's sample data
    window.getDataverseHierarchyData = function() {
        if (window.DataverseHierarchyConfig && window.DataverseHierarchyConfig.liveData) {
            console.log('Returning live data to React app:', window.DataverseHierarchyConfig.liveData.length, 'records');
            return window.DataverseHierarchyConfig.transformedData || window.DataverseHierarchyConfig.liveData;
        }
        console.log('No live data available, React app will use sample data');
        return null;
    };
    
    async function fetchAndApplyLiveData(entityName, lookupField) {
        console.log('Attempting to fetch live data...');
        
        try {
            const liveData = await window.DataverseFetcher.fetchHierarchyData(entityName, lookupField);
            
            if (liveData && liveData.length > 0) {
                console.log('Live data fetched successfully:', liveData.length, 'records');
                
                // Store live data for React app to use
                window.DataverseHierarchyConfig.liveData = liveData;
                window.DataverseHierarchyConfig.dataSource = 'live';
                
                // Dispatch event to notify React app
                window.dispatchEvent(new CustomEvent('dataverseLiveDataLoaded', {
                    detail: { data: liveData, entityName: entityName }
                }));
                
                // Force React app to use live data by overriding the sample data
                window.DataverseHierarchyConfig.hierarchyData = liveData;
                window.DataverseHierarchyConfig.sampleDataOverride = liveData;
                
                // Set up data transformation for the React app
                window.DataverseHierarchyConfig.transformedData = transformDataverseRecords(liveData, entityName, lookupField);
                
            } else {
                console.log('No live data available, will use sample data');
                window.DataverseHierarchyConfig.dataSource = 'sample';
            }
        } catch (error) {
            console.error('Error fetching live data:', error);
            window.DataverseHierarchyConfig.dataSource = 'sample';
        }
    }
    
    // Apply configuration when DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
        applyDataverseConfiguration();
    });
    
    // Also apply immediately in case DOM is already loaded
    if (document.readyState !== 'loading') {
        applyDataverseConfiguration();
    }
    </script>

    <!-- Override React App's Sample Data -->
    <script>
    // Wait for React app to load, then override its data
    window.addEventListener('load', function() {
        // Give React app time to initialize
        setTimeout(function() {
            // Try to override the sample data in React app
            if (window.DataverseHierarchyConfig && window.DataverseHierarchyConfig.liveData) {
                console.log('Attempting to override React app sample data...');
                
                // Multiple approaches to override the data
                
                // Approach 1: Override global variables that React might use
                window.sampleDataverseRecords = window.DataverseHierarchyConfig.transformedData;
                window.hierarchyData = window.DataverseHierarchyConfig.transformedData;
                
                // Approach 2: Dispatch custom event for React to listen to
                window.dispatchEvent(new CustomEvent('dataverseDataOverride', {
                    detail: { 
                        data: window.DataverseHierarchyConfig.transformedData,
                        entityName: window.DataverseHierarchyConfig.entityName 
                    }
                }));
                
                // Approach 3: Try to find and update React component state
                const rootElement = document.getElementById('root');
                if (rootElement && rootElement._reactInternalFiber) {
                    console.log('React fiber found, attempting to update state...');
                }
                
                console.log('Override attempts completed');
            }
        }, 2000); // Wait 2 seconds for React to fully load
    });
    </script>
