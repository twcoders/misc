========upload-to-sharepoint.ps1===

param(
  [string]$tenantId,
  [string]$clientId,
  [string]$clientSecret,
  [string]$siteUrl,
  [string]$libraryName,
  [string]$uploadPath,
  [string]$fileName
)

# Acquire token
$body = @{
  grant_type    = "client_credentials"
  client_id     = $clientId
  client_secret = $clientSecret
  scope         = "https://graph.microsoft.com/.default"
}

$tokenResponse = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$tenantId/oauth2/v2.0/token" -Body $body
$accessToken = $tokenResponse.access_token

# Encode site & library
$siteInfo = Invoke-RestMethod -Headers @{Authorization = "Bearer $accessToken"} `
  -Uri "https://graph.microsoft.com/v1.0/sites?search=$($siteUrl.Split('/')[-1])"

$siteId = $siteInfo.value[0].id

# Upload the ZIP
$bytes = [System.IO.File]::ReadAllBytes($uploadPath)
$uploadUrl = "https://graph.microsoft.com/v1.0/sites/$siteId/drives?$filter=name eq '$libraryName'"

$driveId = (Invoke-RestMethod -Headers @{Authorization = "Bearer $accessToken"} -Uri $uploadUrl).value[0].id

$uploadApi = "https://graph.microsoft.com/v1.0/drives/$driveId/root:/$fileName:/content"

Invoke-RestMethod -Headers @{Authorization = "Bearer $accessToken"} -Uri $uploadApi -Method PUT -Body $bytes



======example
Example Variable Group Setup:
Name	Value (example)	Secret?
tenantId	xxxx-xxxx-xxxx-xxxx	No
clientId	xxxx-xxxx-xxxx-xxxx	No
clientSecret	xxxxxxxxxxxxxxxxxxxxxxxxxx	Yes
sharepointSite	https://yourcompany.sharepoint.com/sites/YourSite	No
documentLibrary	Shared Documents	No


