//
trigger:
  - main  # or your branch name

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'  # Match your Node.js version
    displayName: 'Install Node.js'

  - script: |
      npm ci
      npx playwright install --with-deps
    displayName: 'Install dependencies and Playwright browsers'

  - script: |
      npx playwright test --reporter=html
    displayName: 'Run Playwright Tests'

variables:
  - group: PlaywrightSharePointSecrets  # Reference the Variable Group

steps:
  - script: |
      zip -r playwright-report.zip playwright-report
    displayName: 'Zip Playwright Report'

  - task: PowerShell@2
    inputs:
      filePath: 'upload-to-sharepoint.ps1'
      arguments: >
        -tenantId '$(tenantId)'
        -clientId '$(clientId)'
        -clientSecret '$(clientSecret)'
        -siteUrl '$(sharepointSite)'
        -libraryName '$(documentLibrary)'
        -uploadPath '$(System.DefaultWorkingDirectory)/playwright-report.zip'
        -fileName 'PlaywrightReport_$(Build.BuildId).zip'
    displayName: 'Upload Report to SharePoint'


  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: 'playwright-report'
      artifact: 'playwright-report'
      publishLocation: 'pipeline'
    displayName: 'Publish HTML Report'

