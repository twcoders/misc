<!DOCTYPE html>
<html ng-app="spApp">
<head>
  <meta charset="utf-8">
  <title>SharePoint List Viewer (Paged)</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
    input[type="text"], input[type="date"] { width: 100%; }
    .pagination { margin-top: 10px; }
    button { margin-right: 10px; }
  </style>
</head>
<body ng-controller="ListController">

  <h2>SharePoint List Viewer with Server-Side Paging</h2>

  <label>
    Filter Title:
    <input type="text" ng-model="filters.Title" placeholder="Filter Title">
  </label>

  <label>
    From Date:
    <input type="date" ng-model="filters.fromDate">
  </label>
  <label>
    To Date:
    <input type="date" ng-model="filters.toDate">
  </label>

  <button ng-click="exportCSV()">Export CSV</button>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Created</th>
        <th>Author</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="item in filteredItems = (pagedItems | filter:searchFilter)">
        <td>{{item.Title}}</td>
        <td>{{item.Created | date}}</td>
        <td>{{item.Author.Title}}</td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button ng-disabled="!prevUrl" ng-click="loadPrev()">Previous</button>
    <button ng-disabled="!nextUrl" ng-click="loadNext()">Next</button>
  </div>

<script>
  angular.module('spApp', []).controller('ListController', function($scope, $http) {
    const baseUrl = _spPageContextInfo.webAbsoluteUrl;
    const pageSize = 100;
    let pageStack = [];

    $scope.pagedItems = [];
    $scope.filters = {};
    $scope.nextUrl = null;
    $scope.prevUrl = null;

    const buildUrl = (url) => {
      return url || `${baseUrl}/_api/web/lists/getbytitle('YourList')/items?$top=${pageSize}&$orderby=Created desc&$expand=Author/Id&$select=Id,Title,Created,Author/Title`;
    };

    function loadData(url) {
      $http.get(buildUrl(url), {
        headers: { 'Accept': 'application/json;odata=verbose' }
      }).then(function(response) {
        const data = response.data.d;
        $scope.pagedItems = data.results;
        $scope.nextUrl = data.__next || null;
      });
    }

    $scope.loadNext = function() {
      if ($scope.nextUrl) {
        pageStack.push($scope.nextUrl);
        loadData($scope.nextUrl);
        $scope.prevUrl = pageStack.length > 1 ? pageStack[pageStack.length - 2] : null;
      }
    };

    $scope.loadPrev = function() {
      if (pageStack.length > 1) {
        pageStack.pop(); // current page
        const prev = pageStack[pageStack.length - 1];
        loadData(prev);
        $scope.prevUrl = pageStack.length > 1 ? pageStack[pageStack.length - 2] : null;
      }
    };

    $scope.searchFilter = function(item) {
      const f = $scope.filters;
      if (f.Title && !item.Title?.toLowerCase().includes(f.Title.toLowerCase())) return false;
      if (f.fromDate && new Date(item.Created) < new Date(f.fromDate)) return false;
      if (f.toDate && new Date(item.Created) > new Date(f.toDate)) return false;
      return true;
    };

    $scope.exportCSV = function() {
      const rows = $scope.filteredItems.map(item => 
        [item.Title, item.Created, item.Author.Title]
      );
      let csv = "Title,Created,Author\n" + rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], {type: "text/csv"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sharepoint_export.csv';
      a.click();
    };

    loadData(null); // initial load
  });
</script>
</body>
</html>
